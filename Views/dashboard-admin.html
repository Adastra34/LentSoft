<main style="padding: 2rem 0; min-height: 70vh;">
    <div class="container">
        <h1 style="margin-bottom: 2rem;">Dashboard de Administrador</h1>

        <!-- Stats Cards -->
        <div class="row" style="margin-bottom: 3rem;">
            <div class="col col-3">
                <div class="card text-center" style="background: linear-gradient(135deg, var(--purple-600), var(--purple-700)); color: white;">
                    <h3 style="color: white; margin-bottom: 0.5rem;">Usuarios</h3>
                    <p style="font-size: 2.5rem; font-weight: 700; margin: 0;">156</p>
                </div>
            </div>
            <div class="col col-3">
                <div class="card text-center" style="background: linear-gradient(135deg, var(--info), #2563eb); color: white;">
                    <h3 style="color: white; margin-bottom: 0.5rem;">Productos</h3>
                    <p style="font-size: 2.5rem; font-weight: 700; margin: 0;">42</p>
                </div>
            </div>
            <div class="col col-3">
                <div class="card text-center" style="background: linear-gradient(135deg, var(--success), #059669); color: white;">
                    <h3 style="color: white; margin-bottom: 0.5rem;">Ventas</h3>
                    <p style="font-size: 2.5rem; font-weight: 700; margin: 0;">238</p>
                </div>
            </div>
            <div class="col col-3">
                <div class="card text-center" style="background: linear-gradient(135deg, var(--warning), #d97706); color: white;">
                    <h3 style="color: white; margin-bottom: 0.5rem;">Ingresos</h3>
                    <p style="font-size: 2.5rem; font-weight: 700; margin: 0;">$125K</p>
                </div>
            </div>
        </div>

        <!-- Tabs Navigation -->
        <div style="border-bottom: 2px solid var(--purple-200); margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem;">
                <button class="tab-btn active" data-tab="productos" style="padding: 1rem 2rem; border: none; background: none; border-bottom: 3px solid var(--purple-600); color: var(--purple-700); font-weight: 600; cursor: pointer;">
                    Productos
                </button>
                <button class="tab-btn" data-tab="usuarios" style="padding: 1rem 2rem; border: none; background: none; border-bottom: 3px solid transparent; color: var(--gray-600); font-weight: 600; cursor: pointer;">
                    Usuarios
                </button>
                <button class="tab-btn" data-tab="ventas" style="padding: 1rem 2rem; border: none; background: none; border-bottom: 3px solid transparent; color: var(--gray-600); font-weight: 600; cursor: pointer;">
                    Ventas
                </button>
                <button class="tab-btn" data-tab="inventario" style="padding: 1rem 2rem; border: none; background: none; border-bottom: 3px solid transparent; color: var(--gray-600); font-weight: 600; cursor: pointer;">
                    Inventario
                </button>
            </div>
        </div>

        <!-- Tab Content -->
        <div id="tabContent">
            <!-- Content will be loaded here -->
        </div>
    </div>
</main>

tabButtons.forEach(btn => {
    btn.addEventListener('click', function() {
        // Remove active class from all buttons
        tabButtons.forEach(b => {
            b.style.borderBottomColor = 'transparent';
            b.style.color = 'var(--gray-600)';
            b.classList.remove('active');
        });

        // Add active class to clicked button
        this.style.borderBottomColor = 'var(--purple-600)';
        this.style.color = 'var(--purple-700)';
        this.classList.add('active');

        // Load tab content
        loadTabContent(this.getAttribute('data-tab'));
    });
});

// Load initial tab
loadTabContent('productos');
</script>
